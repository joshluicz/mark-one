" font-weight="bold" fill="#c2410c" >4, 7, then three zeros = 47 000 Ω = 47 kΩ, ±5%</text><rect x="60" y="285" width="50" height="34" rx="4" fill="#111111" stroke="#999"/><text x="85" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="white" >0</text><text x="85" y="338" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >black</text><rect x="120" y="285" width="50" height="34" rx="4" fill="#7a4a21"/><text x="145" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="white" >1</text><text x="145" y="338" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >brown</text><rect x="180" y="285" width="50" height="34" rx="4" fill="#d23a2f"/><text x="205" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="white" >2</text><text x="205" y="338" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >red</text><rect x="240" y="285" width="50" height="34" rx="4" fill="#f07f1a"/><text x="265" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="#1d2733" >3</text><text x="265" y="338" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >orange</text><rect x="300" y="285" width="50" height="34" rx="4" fill="#f4c51f"/><text x="325" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="#1d2733" >4</text><text x="325" y="338" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >yellow</text><rect x="360" y="285" width="50" height="34" rx="4" fill="#2e8b3e"/><text x="385" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="white" >5</text><text x="385" y="338" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >green</text><rect x="420" y="285" width="50" height="34" rx="4" fill="#1f63c9"/><text x="445" y="308" font-size="16" text-anchor="middle" font-weight="bold" fill="white" >6</text><text x="445" y="338" font-size="12" text-anchor="middle" font-weight="normal" fill=
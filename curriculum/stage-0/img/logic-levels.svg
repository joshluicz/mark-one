<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 375" width="470" height="375" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d2733"><rect width="470" height="375" fill="white"/><rect x="120" y="30" width="70" height="90" fill="#bbf7d0" stroke="#15803d"/><rect x="120" y="120" width="70" height="120" fill="#f3f4f6" stroke="#9ca3af"/><rect x="120" y="240" width="70" height="90" fill="#bfdbfe" stroke="#1d4ed8"/><text x="155" y="82" font-size="15" text-anchor="middle" font-weight="bold" fill="#15803d" >HIGH</text><text x="155" y="185" font-size="13" text-anchor="middle" font-weight="normal" fill="#5b6672" >grey zone</text><text x="155" y="292" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d4ed8" >LOW</text><text x="110" y="35" font-size="13" text-anchor="end" font-weight="normal" fill="#1d2733" >5 V</text><text x="110" y="335" font-size="13" text-anchor="end" font-weight="normal" fill="#1d2733" >0 V</text><text x="110" y="125" font-size="13" text-anchor="end" font-weight="bold" fill="#1d2733" >V IH</text><text x="110" y="245" font-size="13" text-anchor="end" font-weight="bold" fill="#1d2733" >V IL</text><text x="205" y="90" font-size="13" text-anchor="start" font-weight="normal" fill="#1d2733" >the chip is guaranteed to read 1</text><text x="205" y="180" font-size="13" text-anchor="start" font-weight="normal" fill="#1d2733" >not guaranteed either way</text><text x="205" y="198" font-size="12" text-anchor="start" font-weight="normal" fill="#5b6672" >(a floating wire can sit anywhere,</text><text x="205" y="214" font-size="12" text-anchor="start" font-weight="normal" fill="#5b6672" >and wander between zones)</text><text x="205" y="295" font-size="13" text-anchor="start" font-weight="normal" fill="#1d2733" >the chip is guaranteed to read 0</text><text x="230" y="362" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >V IH and V IL: your own numbers from the 74HC00 datasheet (S0.2)</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 270" width="770" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d2733"><rect width="770" height="270" fill="white"/><rect x="20" y="10" width="230" height="250" rx="8" fill="#fafaf9" stroke="#e5e7eb"/><text x="135" y="34" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d2733" >1. Heat both</text><text x="135" y="225" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >tip touches pad AND lead,</text><text x="135" y="241" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >count 1–2 seconds</text><rect x="40" y="150" width="190" height="22" fill="#a16207" opacity=".85"/><rect x="105" y="145" width="60" height="5" fill="#d97706"/><rect x="132" y="70" width="6" height="90" fill="#9ca3af"/><path d="M55 70 L123 140 L130 136 L67 58 Z" fill="#6b7280"/><path d="M61 64 L35 38" stroke="#1f2937" stroke-width="16" stroke-linecap="round"/><text x="65" y="32" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >iron</text><rect x="270" y="10" width="230" height="250" rx="8" fill="#fafaf9" stroke="#e5e7eb"/><text x="385" y="34" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d2733" >2. Feed solder</text><text x="385" y="225" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >into the joint,</text><text x="385" y="241" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >not onto the tip</text><rect x="290" y="150" width="190" height="22" fill="#a16207" opacity=".85"/><rect x="355" y="145" width="60" height="5" fill="#d97706"/><rect x="382" y="70" width="6" height="90" fill="#9ca3af"/><path d="M305 70 L373 140 L380 136 L317 58 Z" fill="#6b7280"/><path d="M311 64 L285 38" stroke="#1f2937" stroke-width="16" stroke-linecap="round"/><text x="315" y="32" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >iron</text><path d="M485 60 Q425 110 395 138" stroke="#c0c7cf" stroke-width="5" fill="none"/><path d="M361 145 Q379 140 381 120 L389 120 Q391 140 409 145 Z" fill="#dfe5ea" stroke="#8b949e"/><rect x="520" y="10" width="230" height="250" rx="8" fill="#fafaf9" stroke="#e5e7eb"/><text x="635" y="34" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d2733" >3. Solder away,</text><text x="635" y="51" font-size="15" text-anchor="middle" font-weight="bold" fill="#1d2733" >then iron away</text><text x="635" y="225" font-size="12" text-anchor="middle" font-weight="normal" fill="#5b6672" >about 3 seconds in total</text><rect x="540" y="150" width="190" height="22" fill="#a16207" opacity=".85"/><rect x="605" y="145" width="60" height="5" fill="#d97706"/><rect x="632" y="70" width="6" height="90" fill="#9ca3af"/><path d="M605 145 Q629 138 631 95 L639 95 Q641 138 665 145 Z" fill="#dfe5ea" stroke="#8b949e"/><text x="635" y="80" font-size="13" text-anchor="middle" font-weight="bold" fill="#15803d" >✓ volcano shape</text></svg>
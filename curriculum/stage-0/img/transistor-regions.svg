<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 270" width="710" height="270" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d2733"><rect width="710" height="270" fill="white"/><rect x="20" y="20" width="215" height="210" rx="8" fill="#e5e7eb"/><text x="127" y="48" font-size="16" text-anchor="middle" font-weight="bold" fill="#1d2733" >Cutoff</text><text x="127" y="80" font-size="13" text-anchor="middle" font-weight="normal" fill="#5b6672" >no base current</text><text x="127" y="120" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d2733" >switch OFF</text><text x="127" y="150" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d2733" >no current flows</text><text x="127" y="195" font-size="15" text-anchor="middle" font-weight="bold" fill="#15803d" >no heat</text><rect x="250" y="20" width="215" height="210" rx="8" fill="#fde68a"/><text x="357" y="48" font-size="16" text-anchor="middle" font-weight="bold" fill="#1d2733" >Active region</text><text x="357" y="80" font-size="13" text-anchor="middle" font-weight="normal" fill="#5b6672" >a little base current</text><text x="357" y="120" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d2733" >HALF on (like a valve)</text><text x="357" y="150" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d2733" >some current flows</text><text x="357" y="195" font-size="15" text-anchor="middle" font-weight="bold" fill="#b91c1c" >gets HOT</text><rect x="480" y="20" width="215" height="210" rx="8" fill="#bbf7d0"/><text x="587" y="48" font-size="16" text-anchor="middle" font-weight="bold" fill="#1d2733" >Saturation</text><text x="587" y="80" font-size="13" text-anchor="middle" font-weight="normal" fill="#5b6672" >plenty of base current</text><text x="587" y="120" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d2733" >switch fully ON</text><text x="587" y="150" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d2733" >full current flows</text><text x="587" y="195" font-size="15" text-anchor="middle" font-weight="bold" fill="#15803d" >little heat</text><text x="355" y="258" font-size="14" text-anchor="middle" font-weight="bold" fill="#c2410c" >For a switch, you want the two ends and never the middle.</text></svg>